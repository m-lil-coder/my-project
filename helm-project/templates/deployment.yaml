apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appname }}  
  labels:
    app: {{ .Values.appname }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appname }}
  template:
    metadata:
      name: {{ .Values.appname }}  
      labels:
        app: {{ .Values.appname }}  
    spec:
      serviceAccountName: {{ include "helm-project.serviceAccountName" . }}
      containers:
        - name: mycontainer
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000      # Change containerPort to 5000
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 5000               # Update the liveness probe to use port 5000
          #   initialDelaySeconds: 3
          #   periodSeconds: 5
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 5000               # Update the readiness probe to use port 5000
          #   initialDelaySeconds: 3
          #   periodSeconds: 5
      {{- with .Values.podSecurityContext }}
      securityContext: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
