apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appname }}  
  labels:
    app: {{ .Values.appname }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appname }}
  template:
    metadata:
      name: {{ .Values.appname }}  
      labels:
        app: {{ .Values.appname }}  
    spec:
      serviceAccountName: {{ include "helm-project.serviceAccountName" . }}
      containers:
        - name: mycontainer
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health   # Ensure the health check URL is correct
              port: 5000      # The port your app is listening on
            initialDelaySeconds: 5  # Delay before the probe starts
            periodSeconds: 10       # Frequency of the probe
            failureThreshold: 3     # How many failures before the pod is considered unhealthy
          readinessProbe:
            httpGet:
              path: /health   # Ensure the readiness check URL is correct
              port: 5000      # The port your app is listening on
            initialDelaySeconds: 5  # Delay before the probe starts
            periodSeconds: 10       # Frequency of the probe
            failureThreshold: 3     # How many failures before the pod is considered not ready
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
